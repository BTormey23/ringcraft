<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Course plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ECE7DB; --paper:#FBFAF6; --paper-2:#F3F0E8; --line:#D8D2C4; --line-2:#C4BDAD;
  --ink:#1E2A22; --ink-2:#4E5A52; --ink-3:#7D877F;
  --accent:#2E5A43; --accent-ink:#FFFFFF; --accent-soft:#DCE8DF;
  --bay:#8B5A2B; --rail:#B5422F; --rail-soft:#F3DAD4; --warn:#9A6B10; --warn-soft:#F5E7C6; --ok:#2E5A43;
  --footing:#E4DCCB; --footing-grid:#D3CAB6; --rail-line:#6E6252;
  --route:#2E5A43; --route-jo:#B5422F;
  --shadow:0 1px 2px rgba(30,42,34,.08),0 6px 20px rgba(30,42,34,.08);
  --radius:6px;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Bitter",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141916; --paper:#1C2320; --paper-2:#232B27; --line:#344039; --line-2:#45534B;
    --ink:#E7E5DC; --ink-2:#B6B9B0; --ink-3:#858C85;
    --accent:#7DB796; --accent-ink:#10201A; --accent-soft:#253D31;
    --bay:#C58C55; --rail:#E07A66; --rail-soft:#3E2622; --warn:#D9A93F; --warn-soft:#3A3118; --ok:#7DB796;
    --footing:#2A312C; --footing-grid:#36403A; --rail-line:#A49A88;
    --route:#9DD1B4; --route-jo:#E07A66;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#141916; --paper:#1C2320; --paper-2:#232B27; --line:#344039; --line-2:#45534B;
  --ink:#E7E5DC; --ink-2:#B6B9B0; --ink-3:#858C85;
  --accent:#7DB796; --accent-ink:#10201A; --accent-soft:#253D31;
  --bay:#C58C55; --rail:#E07A66; --rail-soft:#3E2622; --warn:#D9A93F; --warn-soft:#3A3118; --ok:#7DB796;
  --footing:#2A312C; --footing-grid:#36403A; --rail-line:#A49A88;
  --route:#9DD1B4; --route-jo:#E07A66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;color:var(--accent)}
.brand-logo{height:38px;max-width:120px;object-fit:contain;border-radius:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-logo,:root:not([data-theme="light"]) .brand-prev{background:#FBFAF6;padding:2px 4px}}
.brand-prev{width:64px;height:64px;border:1px dashed var(--line-2);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-3);font-size:11px;overflow:hidden}
.brand-prev img{max-width:100%;max-height:100%;object-fit:contain}
.help-body{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.help-body details{border:1px solid var(--line);border-radius:var(--radius);padding:0}
.help-body summary{cursor:pointer;font-weight:600;padding:9px 12px;font-family:var(--font-display)}
.help-body details[open]{background:var(--paper-2)}
.help-body p{margin:0;padding:0 12px 11px;color:var(--ink-2);font-size:13px;line-height:1.5}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand .sub{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;display:block;margin-top:-2px}
.topbar .course-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.topbar .course-title input{border:none;background:transparent;font-family:var(--font-display);font-size:19px;font-weight:600;padding:2px 6px;margin-left:-6px;border-radius:4px;width:100%;max-width:560px}
.topbar .course-title input:hover{background:var(--paper-2)}
.topbar .course-title .meta{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;align-items:center}
.savestate{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;padding-right:6px}
.savestate .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.savestate.saved .dot{background:var(--ok)} .savestate.dirty .dot{background:var(--warn)} .savestate.saving .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.savestate.saving .dot{animation:none}}

.main{display:grid;grid-template-columns:300px 1fr 320px;min-height:0}
.sidebar,.inspector{background:var(--paper);min-height:0;display:flex;flex-direction:column}
.sidebar{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:11px 6px;font-weight:500;color:var(--ink-2);cursor:pointer;letter-spacing:.01em}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;overflow:auto;padding:14px;flex:1;min-height:0}
.panel.active{display:block}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-family:var(--font-ui);font-weight:600;margin:10px 0 8px}
.panel h3:first-child{margin-top:0}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);padding:7px 12px;border-radius:var(--radius);cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--rail);border-color:var(--rail)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{padding:6px 8px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--paper);border-radius:var(--radius);padding:7px 9px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px}
.row .field{flex:1;min-width:0}
.hint{font-size:12px;color:var(--ink-3)}
.divider{border:none;border-top:1px solid var(--line);margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--rail-soft);color:var(--rail);border-color:transparent}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--line-2);background:var(--paper-2)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .t{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .t .name{font-family:var(--font-display);font-size:14px}
.card .m{font-size:12px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.card .acts{display:flex;gap:4px;margin-top:4px}
.card.inv{flex-direction:row;align-items:center;gap:10px;cursor:default}
.card.inv .sym{width:44px;height:30px;flex:none}
.card.inv .body{flex:1;min-width:0}
.card.inv .body .name{font-weight:600}
.card.inv .body .m{font-size:12px}
.card.inv .qty{display:flex;align-items:center;gap:4px}
.card.inv .qty input{width:44px;text-align:center;border:1px solid var(--line-2);border-radius:4px;padding:3px}
.empty{color:var(--ink-3);font-size:13px;padding:20px 6px;text-align:center}

/* ---------- Canvas ---------- */
.canvas-wrap{position:relative;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar .spacer{flex:1}
.toolbar label.tog{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:0 4px}
.stage{flex:1;min-height:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:18px}
.stage svg.plan{width:100%;height:100%;max-height:100%;display:block}
.stage.mode-renumber{cursor:crosshair}
.stage .hud{position:absolute;left:16px;bottom:14px;display:flex;gap:8px;align-items:center;pointer-events:none}
.stage .hud .chip{pointer-events:auto}
.stage .banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:999px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.stage .banner button{background:rgba(255,255,255,.2);border:none;color:inherit;padding:3px 9px;border-radius:999px;cursor:pointer}
.issues{position:absolute;right:14px;bottom:14px;max-width:340px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.issues .chip{max-width:100%;white-space:normal;text-align:left}

/* plan SVG styling (shared with print) */
svg.plan text{font-family:var(--font-ui)}
svg.plan .footing{fill:none}
svg.plan .rail{fill:none;stroke:var(--rail-line);stroke-width:.9}
svg.plan .grid{stroke:var(--footing-grid);stroke-width:.2}
svg.plan .centerline{stroke:var(--footing-grid);stroke-width:.35;stroke-dasharray:3 3}
svg.plan .gate{fill:var(--paper);stroke:var(--rail-line);stroke-width:.6}
svg.plan .gate-label{font-size:3px;fill:var(--ink-2);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
svg.plan .route{fill:none;stroke:var(--route);stroke-width:.75;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
svg.plan .route.jo{stroke:var(--route-jo);stroke-dasharray:2.5 2;stroke-width:.7}
svg.plan .route-arrow{fill:var(--route)}
svg.plan .track-hit{fill:none;stroke:transparent;stroke-width:7;pointer-events:stroke;cursor:copy}
svg.plan .track-hit:hover{stroke:var(--accent);opacity:.18}
svg.plan .wp{fill:var(--paper);stroke:var(--accent);stroke-width:.7;cursor:move;display:none}
svg.plan .handles.hot .wp{display:block}
svg.plan .seg.hot .track-hit{stroke:var(--accent);opacity:.12}
svg.plan .wp:hover{fill:var(--accent-soft)}
@media (hover:none){svg.plan .wp{display:block}}
svg.plan .route-arrow.jo{fill:var(--route-jo)}
svg.plan .fence{cursor:grab}
svg.plan .fence.dragging{cursor:grabbing}
svg.plan .fence .rail-line{stroke:var(--ink);stroke-width:1.15;stroke-linecap:round}
svg.plan .fence.oxer .rail-line,svg.plan .fence.swedish .rail-line,svg.plan .fence.triple .rail-line{stroke:var(--bay)}
svg.plan .fence .wing{stroke:var(--ink-2);stroke-width:.45}
svg.plan .fence .fill-box{fill:var(--bay);opacity:.85}
svg.plan .fence .water{fill:#5B8DB8;opacity:.6}
svg.plan .fence .brush{fill:var(--accent);opacity:.7}
svg.plan .fence .dir{fill:var(--ink-2)}
svg.plan .fence .hit{fill:transparent;stroke:none}
svg.plan .fence .badge{fill:var(--paper);stroke:var(--ink);stroke-width:.55}
svg.plan .fence .badge-jo{fill:var(--route-jo);stroke:none}
svg.plan .fence .badge-t{font-size:3.7px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:var(--font-mono)}
svg.plan .fence .badge-jo-t{font-size:2.5px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central;font-family:var(--font-mono)}
svg.plan .fence .lbl{font-size:2.4px;fill:var(--ink-2);text-anchor:middle}
svg.plan .fence.selected .sel{fill:none;stroke:var(--accent);stroke-width:.6;stroke-dasharray:1.5 1.2}
svg.plan .fence .sel{display:none}
svg.plan .fence.selected .sel{display:block}
svg.plan .fence .rot-handle{fill:var(--paper);stroke:var(--accent);stroke-width:.6;cursor:alias;display:none}
svg.plan .fence.selected .rot-handle{display:block}
svg.plan .dist{font-size:2.6px;fill:var(--accent);font-weight:600;text-anchor:middle;font-family:var(--font-mono)}
svg.plan .dist-bg{fill:var(--paper);opacity:.9}

svg.plan .startfin{font-size:2.8px;font-weight:700;fill:var(--ink);text-anchor:middle;letter-spacing:.08em}
svg.plan .startfin-line{stroke:var(--ink);stroke-width:.6}
svg.plan .scale-t{font-size:2.6px;fill:var(--ink-3);font-family:var(--font-mono)}
svg.plan .scale-l{stroke:var(--ink-3);stroke-width:.5}
svg.plan .dim-t{font-size:3px;fill:var(--ink-3);font-family:var(--font-mono);text-anchor:middle}
svg.plan .collide .rail-line{stroke:var(--rail)}
svg.plan .ms-line{stroke:var(--warn);stroke-width:.6;stroke-dasharray:1.5 1.2}
svg.plan .ms-dot{fill:var(--warn)}
svg.plan .ms-t{font-size:2.8px;font-weight:600;fill:var(--warn);text-anchor:middle;font-family:var(--font-mono)}
.card.inv img.sym.thumb{width:44px;height:30px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.ps-side td img.thumb{width:.42in;height:.3in;object-fit:cover;border-radius:2px;float:left;margin:0 4px 2px 0;border:.5pt solid #CFC9BC}
.ps-side.crew{grid-template-columns:minmax(0,1fr) 1.5in;font-size:7.5pt}
.ps.v-crew .ps-plan{height:3.5in}
.ps-side.crew td img.thumb{width:.34in;height:.24in}
.ps.v-judge .ps-side table{font-size:9.5pt}
.ps.v-judge .ps-side td{padding:4px 3px}
.prvar{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
.prvar label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.prvar label:hover{background:var(--paper-2)}
.prvar label b{display:block}
.prvar label span{font-size:12px;color:var(--ink-2)}
.prvar input{margin-top:3px}
.toolbar .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
svg.plan .fence.inactive{opacity:.32}
svg.plan .fence.inactive .dir{display:none}
svg.plan .fence.inactive.selected{opacity:.7}

/* ---------- Inspector ---------- */
.insp-head{padding:14px 14px 8px;border-bottom:1px solid var(--line)}
.insp-head h2{font-size:17px}
.insp-head .hint{margin-top:2px}
.insp-body{overflow:auto;padding:14px;flex:1;min-height:0}
.fence-list{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.fence-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer}
.fence-row:hover{background:var(--paper-2)}
.fence-row.active{border-color:var(--accent);background:var(--accent-soft)}
.fence-row .n{font-family:var(--font-mono);font-weight:600;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--paper)}
.fence-row .d{font-size:12.5px;line-height:1.25}
.fence-row .d small{display:block;color:var(--ink-3);font-size:11px}
.fence-row .h{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.segbtns{display:flex;gap:2px;flex-wrap:wrap}
.segbtns button{border:1px solid var(--line-2);background:var(--paper);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.segbtns button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--font-mono)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border-radius:10px;box-shadow:var(--shadow);width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px 24px}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .lead{color:var(--ink-2);margin:0 0 16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.tmpl{border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tmpl:hover{background:var(--paper-2)}
.tmpl.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tmpl .tn{font-weight:600;font-family:var(--font-display)}
.tmpl .td{font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}

body[data-build=web] .artifact-only{display:none}
body[data-build=artifact] .web-only{display:none}

/* ---------- Rider view (read-only, phone-first) ---------- */
body.rider #app,body.rider .modal-bg,body.rider .toast{display:none !important}
#riderview{display:none}
body.rider #riderview{display:block}
.rv-wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
.rv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.rv-fac{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.rv-logo{height:44px;max-width:140px;object-fit:contain;display:block;margin-bottom:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rv-logo{background:#FBFAF6;border-radius:4px;padding:2px 4px}}
.rv-head h1{font-size:22px}
.rv-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.rv-head .order{border:1.5px solid var(--ink);border-radius:4px;padding:3px 9px;font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.rv-plan{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.rv-plan svg{display:block;min-width:100%}
.rv-zoom{display:flex;gap:8px;align-items:center;justify-content:center}
.rv-stats{display:flex;gap:6px;flex-wrap:wrap}
.rv-table{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.rv-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line)}
.rv-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rv-table td.n{font-family:var(--font-mono);font-weight:600}
.rv-table small{color:var(--ink-3)}
.rv-notes{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap}
.rv-foot{font-size:12px;color:var(--ink-3);text-align:center}
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}

      <rect class="hit" x="${-9 - (f.spread || 0) / 24}" y="${-w / 2 - 3}" width="${18 + (f.spread || 0) / 12}" height="${w + 6}"/>
      <rect class="sel" x="-8" y="${-w / 2 - 3}" width="16" height="${w + 6}" rx="1.5"/>
      <g transform="rotate(90)">${fenceSymbol(f)}</g>
      <polygon class="dir" points="4.6,0 2.4,1.3 2.4,-1.3"/>
      <g transform="translate(-7.5,${w / 2 + 1.5}) rotate(${-f.hd}) scale(1,-1)">
        ${inactive ? '' : `<circle class="badge" r="2.9"/><text class="badge-t">${esc(label)}</text>`}
        ${joIndex[idx] && showJo ? `<g transform="translate(2.8,-2.8)"><circle class="badge-jo" r="1.7"/><text class="badge-jo-t">${joIndex[idx]}</text></g>` : ''}
      </g>
      <g transform="translate(6.5,${w / 2 + 2.5}) rotate(${-f.hd}) scale(1,-1)"><text class="lbl" dominant-baseline="central">${opts.labels === false || inactive ? '' : esc(fmtHeight(f.height, U) + (f.trot ? ' · trot' : ''))}</text></g>
      <circle class="rot-handle" cx="0" cy="${w / 2 + 7}" r="2.2"/>
    </g>`;
  });
  if (opts.measures && opts.measures.length) g += opts.measures.map(m => measureSVG(m, opts.units, opts.stride, false)).join('');
  // scale bar
  const sb = metric ? 32.8084 : 50; const sbx = -L / 2, sby = -W / 2 - 9;
  g += `<line class="scale-l" x1="${sbx}" y1="${sby}" x2="${sbx + sb}" y2="${sby}"/><line class="scale-l" x1="${sbx}" y1="${sby - 1.5}" x2="${sbx}" y2="${sby + 1.5}"/><line class="scale-l" x1="${sbx + sb}" y1="${sby - 1.5}" x2="${sbx + sb}" y2="${sby + 1.5}"/><text class="scale-t" x="${sbx + sb + 2}" y="${-sby}" transform="scale(1,-1)" dominant-baseline="central">${metric ? '10 m' : "50'"}</text>`;
  return `<svg class="plan" xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet"><g transform="scale(1,-1)">${g}</g></svg>`;
}
/* ============================================================
   Rider view rendering + self-contained share payloads.
   Shared by the designer (index.html) and the standalone
   rider page (rider.html) so both show exactly the same thing.
   ============================================================ */
function riderCourseHTML(c, ring, settings, opts = {}) {
  const nums = numberFences(c); const U = courseUnits(c); const st = courseStats(c, ring); const lvl = (LEVELS[c.disc] || []).find(l => l.id === c.levelId);
  return `<div class="rv-wrap"><header class="rv-head"><div>${opts.back ? '<button class="btn sm" id="rvBack" style="margin-bottom:6px">‹ All courses</button><br>' : ''}${settings.branding && settings.branding.logo ? `<img class="rv-logo" src="${settings.branding.logo}" alt="">` : ''}<div class="rv-fac">${esc(settings.facility || '')}</div><h1>${esc(c.name)}</h1><div class="rv-sub">${[c.className, (DISCIPLINES[c.disc]?.label || '') + (lvl ? ' · ' + lvl.label : ''), fmtHeight(c.height, U), c.event, fmtDate(c.date, c.time), c.timing].filter(Boolean).map(esc).join(' · ')}</div></div>${c.showOrder ? `<div class="order">Class ${esc(c.showOrder)}</div>` : ''}</header>
    <div class="rv-plan" id="rvPlan">${renderPlanSVG(c, ring, [], { route: true, dist: true, grid: true, jo: true, unused: false })}</div>
    <div class="rv-zoom"><button class="btn sm" id="rvOut">−</button><span class="hint">pinch or use buttons to zoom</span><button class="btn sm" id="rvIn">+</button><button class="btn sm" id="rvFit">Fit</button></div>
    <div class="rv-stats">${st ? `<span class="chip">${isMetric(U) ? Math.round(st.lengthM) + ' m' : Math.round(st.lengthFt) + "'"} track</span>` : ''}${st && st.timeAllowed ? `<span class="chip">TA ${fmtSecs(st.timeAllowed)} · limit ${fmtSecs(st.timeLimit)}</span>` : ''}<span class="chip">${fmtStride(c.stride, U)} stride</span>${c.disc === 'jumper' && nums.some(n => n.fence.jo) ? `<span class="chip bad">Jump-off: ${nums.filter(n => n.fence.jo).map(n => n.label).join(' – ')}</span>` : ''}</div>
    <table class="rv-table"><thead><tr><th>#</th><th>Jump</th><th>Height</th><th>To next</th></tr></thead><tbody>${nums.map(({ label, fence: f, idx }) => { const nx = c.fences[idx + 1]; const rel = nx && isActive(nx) ? relatedDistance(f, nx, c.stride) : null; return `<tr><td class="n">${label}</td><td>${esc(f.name)}<br><small>${JUMP_TYPES[f.type]?.label}${f.trot ? ' · trot' : ''}${f.note ? ' — ' + esc(f.note) : ''}</small></td><td class="mono">${fmtHeight(f.height, U)}${SPREAD_TYPES.has(f.type) ? '<br><small>× ' + fmtHeight(f.spread || defaultSpread(f.type, f.height), U) + '</small>' : ''}</td><td class="mono">${rel ? (rel.rounded < 1 ? 'bounce' : rel.rounded + (rel.kind === 'bend' ? ' bend' : ' str')) + '<br><small>' + fmtDist(rel.d, U) + '</small>' : ''}</td></tr>`; }).join('')}</tbody></table>
    ${c.notes ? `<div class="rv-notes"><b>Notes</b><br>${esc(c.notes)}</div>` : ''}<footer class="rv-foot">${esc(c.footer || (settings.facility || '') + ' · ' + APP_NAME)}${c.designer ? ' · Course designer: ' + esc(c.designer) : ''}<br><small>${APP_NAME} — ${APP_CREDIT}</small></footer></div>`;
}
function riderBindZoom(root) {
  let zoom = 1; const plan = $('#rvPlan', root); if (!plan) return; const svg = $('svg', plan); const apply = () => { svg.style.width = (100 * zoom) + '%'; svg.style.height = 'auto'; };
  $('#rvIn', root).onclick = () => { zoom = Math.min(4, zoom * 1.35); apply(); }; $('#rvOut', root).onclick = () => { zoom = Math.max(1, zoom / 1.35); apply(); }; $('#rvFit', root).onclick = () => { zoom = 1; apply(); plan.scrollTo(0, 0); };
  apply();
}
function riderListHTML(courses, settings, opts = {}) {
  const byDate = {}; courses.forEach(c => (byDate[c.date || 'Undated'] = byDate[c.date || 'Undated'] || []).push(c));
  return `<div class="rv-wrap"><header class="rv-head"><div>${settings.branding && settings.branding.logo ? `<img class="rv-logo" src="${settings.branding.logo}" alt="">` : ''}<div class="rv-fac">${esc(settings.facility || '')}</div><h1>Courses</h1><div class="rv-sub">Tap a class to open its course plan</div></div>${opts.designerButton ? '<button class="btn sm" id="rvDesigner">Open designer</button>' : ''}</header>
    ${courses.length ? Object.entries(byDate).map(([d, cs]) => `<h3 class="rv-date">${esc(d === 'Undated' ? d : fmtDate(d))}</h3><div class="rv-list">${cs.map(c => { const ring = c._ring; const lvl = (LEVELS[c.disc] || []).find(l => l.id === c.levelId); return `<button class="rv-item" data-id="${c.id}"><span class="rv-order">${esc(c.showOrder || '')}</span><span><b>${esc(c.name)}</b><br><small>${[c.className, (DISCIPLINES[c.disc]?.label || '') + (lvl ? ' · ' + lvl.label : ''), fmtHeight(c.height, courseUnits(c)), ring ? ring.name : '', c.time ? (fmtDate(c.date, c.time).split(' · ')[1] || '') : ''].filter(Boolean).map(esc).join(' · ')}</small></span><span class="rv-chev">›</span></button>`; }).join('')}</div>`).join('') : '<div class="empty">No courses are published yet.</div>'}
    <footer class="rv-foot">${esc(settings.facility || '')} · ${APP_NAME}<br><small>${APP_NAME} — ${APP_CREDIT}</small></footer></div>`;
}

// ---------- Share payload: everything a rider page needs, compressed into the URL hash ----------
const SharePayload = {
  pack(c, ring, settings) {
    const act = c.fences.filter(isActive); const idx = id => act.findIndex(x => x.id === id);
    const r1 = x => Math.round(x * 10) / 10;
    const f = act.map(x => [r1(x.u), r1(x.v), Math.round(x.hd), x.type, x.name || '', r1(x.height), x.width || 12, x.spread || 0, (x.jo ? 1 : 0) | (x.trot ? 2 : 0), x.note || '', x.combo ? act.filter(y => y.combo === x.combo).map(y => idx(y.id)).join('.') : '']);
    const track = {}; for (const [k, v] of Object.entries(c.track || {})) { const [a, b] = k.split('>').map(idx); if (a >= 0 && b >= 0) track[a + '>' + b] = v.map(p => [Math.round(p.x), Math.round(p.y)]); }
    const o = { v: 2, id: c.id, n: c.name, cl: c.className, ev: c.event, o: c.showOrder, t: c.timing, d: c.date, tm: c.time, r: c.rider, ds: c.designer, fo: c.footer, disc: c.disc, lv: c.levelId, u: c.units, s: c.stride, h: c.height, sp: c.speed, nt: c.notes, fac: settings.facility, ring: [ring.name, ring.L, ring.W, ring.units, ring.gate], f, tr: track };
    Object.keys(o).forEach(k => { if (o[k] === '' || o[k] == null || o[k] === false) delete o[k]; }); if (!Object.keys(track).length) delete o.tr;
    return o;
  },
  unpack(p) {
    if (p.v === 1) return SharePayload.unpackV1(p);
    const ids = p.f.map((_, i) => 'f' + i);
    const fences = p.f.map((x, i) => ({ id: ids[i], u: x[0], v: x[1], hd: x[2], type: x[3], name: x[4], height: x[5], width: x[6], spread: x[7] || 0, jo: !!(x[8] & 1), trot: !!(x[8] & 2), note: x[9] || '', combo: x[10] ? 'c' + x[10] : null, active: true }));
    const track = {}; for (const [k, v] of Object.entries(p.tr || {})) { const [a, b] = k.split('>'); track[ids[+a] + '>' + ids[+b]] = v.map(q => ({ x: q[0], y: q[1] })); }
    const course = { id: p.id, name: p.n || 'Course', className: p.cl || '', event: p.ev || '', showOrder: p.o || '', timing: p.t || '', date: p.d || '', time: p.tm || '', rider: p.r || '', designer: p.ds || '', footer: p.fo || '', disc: p.disc, levelId: p.lv, units: p.u, stride: p.s, height: p.h, speed: p.sp || 0, notes: p.nt || '', fences, track };
    const ring = { id: 'r', name: p.ring[0], L: p.ring[1], W: p.ring[2], units: p.ring[3], gate: p.ring[4] };
    return { course, ring, settings: { facility: p.fac || '' } };
  },
  unpackV1(p) {
    const ids = p.f.map(x => x[11] || uid());
    const fences = p.f.map((x, i) => ({ id: ids[i], u: x[0], v: x[1], hd: x[2], type: x[3], name: x[4], height: x[5], width: x[6], spread: x[7] || 0, jo: !!(x[8] & 1), trot: !!(x[8] & 2), note: x[9], combo: x[10] || null, active: true }));
    const track = {}; for (const [k, v] of Object.entries(p.tr || {})) track[k] = v.map(q => ({ x: q[0], y: q[1] }));
    const course = { id: p.id, name: p.n, className: p.cl, event: p.ev, showOrder: p.o, timing: p.t, date: p.d, time: p.tm, rider: p.r, designer: p.ds, footer: p.fo, disc: p.disc, levelId: p.lv, units: p.u, stride: p.s, height: p.h, speed: p.sp, notes: p.nt, fences, track };
    const ring = { id: 'r', name: p.ring.n, L: p.ring.L, W: p.ring.W, units: p.ring.u, gate: p.ring.g };
    return { course, ring, settings: { facility: p.fac || '' } };
  },
  async encode(obj) {
    const json = JSON.stringify(obj); const bytes = new TextEncoder().encode(json);
    let out, prefix = 'u';
    if (typeof CompressionStream === 'function') { try { const cs = new CompressionStream('deflate-raw'); const w = cs.writable.getWriter(); w.write(bytes); w.close(); out = new Uint8Array(await new Response(cs.readable).arrayBuffer()); prefix = 'z'; } catch (e) { out = bytes; } } else out = bytes;
    let s = ''; out.forEach(b => s += String.fromCharCode(b));
    return prefix + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  async decode(str) {
    const prefix = str[0]; let b64 = str.slice(1).replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '=';
    const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    let json;
    if (prefix === 'z') { if (typeof DecompressionStream !== 'function') throw new Error('This browser cannot open compressed links'); const ds = new DecompressionStream('deflate-raw'); const w = ds.writable.getWriter(); w.write(bytes); w.close(); json = await new Response(ds.readable).text(); }
    else json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  },
};
/* Standalone rider page boot.
   Understands three kinds of address:
   - #<courseId> or #riders  → live view, read from board.json on the same site (updates when the designer saves)
   - #c=<payload>            → one locked course carried inside the link itself
   - #b=<payload>            → a locked list of courses carried inside the link  */
const App = { data: { settings: {} } };
function toast(m) { const t = document.getElementById('toast'); if (!t) return; t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function showError(title, text) { document.getElementById('riderview').innerHTML = `<div class="rv-wrap"><header class="rv-head"><div><h1>${esc(title)}</h1><div class="rv-sub">${esc(text)}</div></div></header></div>`; }
(async function main() {
  document.body.classList.add('rider');
  const root = document.getElementById('riderview');
  const tint = st => { const a = st && st.branding && st.branding.accent; if (a && /^#[0-9a-fA-F]{6}$/.test(a)) { document.documentElement.style.setProperty('--accent', a); document.documentElement.style.setProperty('--route', a); } };
  const open = (entry, back) => { const { course, ring, settings } = entry; tint(settings); root.innerHTML = riderCourseHTML(course, ring, settings, { back }); riderBindZoom(root); document.title = course.name + ' · course plan'; const b = root.querySelector('#rvBack'); if (b) b.onclick = () => board(entry._list || []); window.scrollTo(0, 0); };
  const board = list => { const settings = list.length ? list[0].settings : { facility: '' }; tint(settings); const cs = list.map(e => Object.assign({}, e.course, { _ring: e.ring })); root.innerHTML = riderListHTML(cs, settings); root.querySelectorAll('.rv-item').forEach(b => b.onclick = () => open(list.find(e => e.course.id === b.dataset.id), true)); document.title = (settings.facility || 'Courses') + ' · courses'; };
  const withList = list => { list.forEach(e => e._list = list); return list; };
  const h = decodeURIComponent(location.hash || '').replace(/^#/, '');
  const pm = h.match(/^(c|b)=([A-Za-z0-9_\-]+)$/);
  try {
    if (pm) { // locked payload links
      const payload = await SharePayload.decode(pm[2]);
      const list = withList(pm[1] === 'b' ? payload.map(p => SharePayload.unpack(p)) : [SharePayload.unpack(payload)]);
      if (list.length === 1) open(list[0], false); else board(list);
      return;
    }
    // live links — read the board published next to this page.
    // GitHub Pages rebuilds the public site in a background job that can lag minutes behind
    // (and is throttled), so on *.github.io we ALSO read the raw file straight from the
    // repository and use whichever copy is newest.
    let bd = null;
    const srcs = ['board.json'];
    const gh = location.hostname.match(/^([A-Za-z0-9-]+)\.github\.io$/);
    const seg = location.pathname.split('/').filter(Boolean)[0];
    if (gh && seg) { srcs.unshift(`https://raw.githubusercontent.com/${gh[1]}/${seg}/main/board.json`, `https://raw.githubusercontent.com/${gh[1]}/${seg}/master/board.json`); }
    for (const u of srcs) {
      try { const r = await fetch(u + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j && (!bd || (j.updated || 0) > (bd.updated || 0))) bd = j; } } catch (e) {}
      if (bd && u === srcs[0]) break; // raw copy is authoritative when it loads
    }
    if (!bd) { showError('No courses here yet', location.protocol === 'file:' ? 'This page reads board.json from the website it is hosted on. Open it from your site, or use a link that carries the course inside it.' : 'The rider board has not been published yet — check back soon.'); return; }
    const list = withList((bd.courses || []).map(p => { const e = SharePayload.unpack(p); if (!e.settings.facility && bd.fac) e.settings.facility = bd.fac; if (bd.brand) e.settings.branding = bd.brand; return e; }));
    if (!h || h === 'riders') { board(list); return; }
    const hit = list.find(e => e.course.id === h);
    if (hit) open(hit, list.length > 1);
    else { board(list); if (list.length) toast('That course is no longer published — here is the current list'); else showError('No courses published', 'Nothing is on the rider board right now.'); }
  } catch (e) { console.error(e); showError('This link could not be opened', 'The course data could not be read. ' + (e.message || '')); }
})();
